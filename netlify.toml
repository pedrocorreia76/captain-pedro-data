# Netlify reads this when the site is linked to this repo.
# The website lives in site/. Price/holdings/report JSON files are read by the page from raw.githubusercontent.com,
# so data-only commits (every few hours) skip the Netlify deploy.
[build]
  publish = "site"
  command = ""
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"
